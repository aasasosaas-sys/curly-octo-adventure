<style>
/* Layout: 試験のマークシートを模した縦長の一枚。上にタブ、部ごとにテーマの解答欄、下に採点バー */
:root{
 --paper:#F4F7F6; --sheet:#FFFFFF; --ink:#18302E; --sub:#5B6F6C; --line:#D5DFDC;
 --drop:#E0664F; --dropsoft:#FBE3DD; --teal:#0F4C5C; --tealsoft:#DCEBEE;
 --good:#2E7D4F; --goodsoft:#DDF1E4; --warn:#B7791F; --warnsoft:#FBF0D9; --bad:#C2412D; --badsoft:#FADFD9;
 --f-disp:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
 --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
 --f-num:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0F1716;--sheet:#16211F;--ink:#E3ECEA;--sub:#93A8A4;--line:#2A3A37;--drop:#F08A74;--dropsoft:#3A2420;--teal:#6CB8C9;--tealsoft:#173238;--good:#6CCB92;--goodsoft:#173225;--warn:#E6B45C;--warnsoft:#33291A;--bad:#F08A74;--badsoft:#3A2420;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1716;--sheet:#16211F;--ink:#E3ECEA;--sub:#93A8A4;--line:#2A3A37;--drop:#F08A74;--dropsoft:#3A2420;--teal:#6CB8C9;--tealsoft:#173238;--good:#6CCB92;--goodsoft:#173225;--warn:#E6B45C;--warnsoft:#33291A;--bad:#F08A74;--badsoft:#3A2420;color-scheme:dark}
*{box-sizing:border-box}

.parts{display:flex;flex-wrap:wrap;gap:6px;padding-block:14px 6px}
.chip{font:700 13px var(--f-body);border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:var(--sheet)}

.parthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-block:6px}

.thead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--tealsoft)}
.tid{font:700 13px var(--f-num);background:var(--teal);color:var(--sheet);border-radius:4px;padding:1px 7px}
.ttl{font-weight:700;flex:1;min-width:0}
.tscore{font:700 14px var(--f-num);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:5px 14px;border-top:1px dashed var(--line)}
.qn{font:500 13px var(--f-num);color:var(--sub);width:62px;flex:none}
.bub{display:flex;flex-wrap:wrap;gap:6px}
.b{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--drop);background:transparent;color:var(--drop);font:700 14px var(--f-num);cursor:pointer;display:grid;place-items:center;padding:0}
.b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.row.ok .b[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.row.ng .b[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.row .b.ans{box-shadow:0 0 0 3px var(--goodsoft),0 0 0 5px var(--good)}
.mk{margin-left:auto;font:700 13px var(--f-num);min-width:2.5em;text-align:right}
.row.ok .mk{color:var(--good)} .row.ng .mk{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:2px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}

.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13px;color:var(--sub);flex:1;min-width:160px}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.rcard .top{display:flex;align-items:center;gap:8px}
.pill{font:700 12px var(--f-body);border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.weak{background:var(--badsoft);color:var(--bad)} .pill.mid{background:var(--warnsoft);color:var(--warn)} .pill.good{background:var(--goodsoft);color:var(--good)} .pill.none{background:var(--line);color:var(--sub)}
.wrong{font:500 12px var(--f-num);color:var(--sub);margin-top:3px;word-break:break-all}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font:700 26px var(--f-num)}

.weaklist{background:var(--sheet);border:2px solid var(--bad);border-radius:10px;padding:12px 14px;margin-block:10px}
.weaklist h3{margin:0 0 6px;font-family:var(--f-disp);color:var(--bad);font-size:17px}
.weaklist ol{margin:0;padding-left:1.4em}
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:700;background:var(--tealsoft);position:sticky;top:0}
td.t{white-space:normal;min-width:11em}
.meter{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
svg.sp{vertical-align:middle}
.hist{display:grid;gap:8px}
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.hcard .d{font:500 13px var(--f-num);color:var(--sub)}
.hcard .s{font:700 16px var(--f-num)}
.hcard .th{flex-basis:100%;font-size:13px;color:var(--sub)}
.del{margin-left:auto;font:700 12px var(--f-body);background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:4px 10px;cursor:pointer}
.del.confirm{border-color:var(--bad);color:var(--bad)}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--sub);text-align:center}
.legend{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 12px;margin-block:6px}
select{font:700 14px var(--f-body);padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
@media (max-width:480px){.b{width:30px;height:30px;font-size:13px}.qn{width:52px}.row{gap:6px;padding:5px 10px}}
@media (prefers-reduced-motion:no-preference){.b{transition:background .12s,transform .08s}.b:active{transform:scale(.92)}}
</style>
<div class="wrap">
<header>
  <h1><small>テーマ別問題集 地理 知識編</small>知識編マークシート</h1>
  <div class="store" id="store">記録の保存先を確認中…</div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-mark" aria-selected="true">マーク</button>
  <button role="tab" id="tab-stat" aria-selected="false">テーマ別成績</button>
  <button role="tab" id="tab-hist" aria-selected="false">履歴</button>
</nav>
<section id="v-mark">
  <div class="parts" id="parts"></div>
  <div class="parthead"><h2 id="ptitle"></h2><span id="pinfo"></span></div>
  <div id="result"></div>

</section>

  <div class="sum" id="sum"></div>
  <div id="weak"></div>
  <div class="filters"><label for="fpart">表示する部</label><select id="fpart"></select>
    <label for="fsort">並べ方</label><select id="fsort"><option value="rate">苦手順（正答率が低い順）</option><option value="id">テーマ番号順</option></select></div>
  <div class="legend"><span class="pill weak">苦手</span>最新の正答率60%未満 <span class="pill mid">要復習</span>60〜79% <span class="pill good">得意</span>80%以上 <span class="pill none">未挑戦</span></div>
  <div class="tbl"><table><thead><tr><th>テーマ</th><th>判定</th><th>最新</th><th>最高</th><th>回数</th><th>推移</th></tr></thead><tbody id="stbody"></tbody></table></div>
</section>
<section id="v-hist" hidden><div class="hist" id="hist"></div></section>
</div>

  <button class="btn pri" id="grade">採点して記録</button>
</div></div>
<script>
const DATA=[{"p":"第1部","n":"地形","th":[{"id":"A01","t":"プレート境界と大地形","q":[[6,4],[4,3],[4,4],[4,3],[4,3],[6,4],[4,2],[4,3],[4,2],[4,1],[4,4],[4,2]]},{"id":"A02","t":"地震・火山・海底地形","q":[[6,4],[4,3],[6,1],[4,2],[6,2]]},{"id":"A03","t":"海岸・氷河・サンゴ礁の地形","q":[[6,6],[4,2],[4,2],[4,1],[4,2],[4,2],[4,1],[4,2]]},{"id":"A04","t":"河川の流量と土砂","q":[[4,2],[4,2],[4,2]]},{"id":"A05","t":"海底・湖沼・海岸の地形","q":[[4,4],[4,4],[4,4],[4,4],[4,2],[4,4],[4,4]]}]},{"p":"第2部","n":"気候・植生・土壌・環境","th":[{"id":"B01","t":"気圧帯・風・熱帯低気圧","q":[[4,3],[4,4],[4,4],[6,6],[4,2]]},{"id":"B02","t":"気候区と雨温図・ハイサーグラフ","q":[[6,5],[4,3],[4,3],[4,4],[4,3],[4,2]]},{"id":"B03","t":"植生と土壌","q":[[6,2],[4,2],[4,3],[4,2],[4,2]]},{"id":"B04","t":"地球環境問題","q":[[4,1],[4,3],[4,4],[4,1],[4,1]]},{"id":"B05","t":"大気・海洋の循環と異常気象","q":[[4,4],[4,2],[4,4],[4,1],[4,4],[4,3],[4,3],[4,2],[6,2]]}]},{"p":"第3部","n":"日本の自然と防災","th":[{"id":"C01","t":"日本の気候","q":[[4,3],[4,3],[6,3],[4,3],[4,1],[4,4]]},{"id":"C02","t":"日本の自然災害","q":[[4,3],[4,3],[4,1],[4,1],[4,4],[4,4],[4,4]]},{"id":"C03","t":"防災と地域調査","q":[[4,1],[4,3],[4,4]]},{"id":"C04","t":"日本の地形・植生と都市の災害","q":[[4,1],[4,4],[4,4],[4,4],[4,3]]}]},{"p":"第4部","n":"農林水産業","th":[{"id":"D01","t":"世界の農業地域と農業の成立","q":[[4,1],[4,4],[4,4],[4,2],[4,4],[4,1]]},{"id":"D02","t":"穀物・食料問題・農業のグローバル化","q":[[4,4],[4,4],[4,3],[4,4],[4,4],[4,4]]},{"id":"D03","t":"水産業","q":[[6,2],[4,4],[4,4]]},{"id":"D04","t":"農産物・水産物・林産物の統計","q":[[4,4],[4,4],[4,3],[4,4],[4,4],[4,2],[4,4],[4,4],[4,4],[6,3]]}]},{"p":"第5部","n":"資源・エネルギー・工業","th":[{"id":"E01","t":"資源・エネルギー","q":[[4,4],[4,3],[4,3],[4,4],[4,2]]},{"id":"E02","t":"工業の立地と発展","q":[[4,3],[4,4],[4,1],[4,2],[4,2],[4,2],[4,3],[4,4]]},{"id":"E03","t":"産業の立地・交通・グローバル化","q":[[4,3],[4,4],[4,1],[4,1],[4,2]]},{"id":"E04","t":"資源・工業の統計と各国の特色","q":[[4,4],[4,4],[4,4],[4,4],[4,4],[4,1],[4,4],[6,5],[4,1],[4,1]]}]},{"p":"第6部","n":"交通・通信・貿易・国際協力","th":[{"id":"F01","t":"交通（陸運・海運・空運）","q":[[4,1],[6,1],[4,1],[4,4]]},{"id":"F02","t":"貿易と経済統合","q":[[5,3],[4,4],[4,4],[4,2],[4,3],[4,2]]},{"id":"F03","t":"観光・通信と国際協力","q":[[6,3],[4,4],[4,2],[4,4],[4,3],[4,1],[4,2]]},{"id":"F04","t":"貿易・観光・通信の統計","q":[[4,4],[4,2],[4,4],[4,4],[4,4],[4,4],[4,1]]}]},{"p":"第7部","n":"人口・都市・村落","th":[{"id":"G01","t":"人口問題","q":[[4,2],[4,3]]},{"id":"G02","t":"都市の機能と都市問題","q":[[4,3],[4,4],[4,4],[4,1],[4,2],[4,3],[4,3]]},{"id":"G03","t":"村落の立地と形態","q":[[4,4],[4,2]]},{"id":"G04","t":"都市の立地・機能と世界都市","q":[[4,1],[4,1],[4,3],[6,1],[4,4],[4,1]]},{"id":"G05","t":"都市計画と都市・人口の諸問題","q":[[6,4],[4,4],[4,3],[4,4],[4,3],[4,1],[4,1],[4,3]]},{"id":"G06","t":"都市圏・人口構成の読み取り","q":[[4,4],[4,1],[4,4],[4,4],[4,4]]}]},{"p":"第8部","n":"生活文化・民族・国家","th":[{"id":"H01","t":"民族・宗教・言語と生活文化","q":[[4,1],[4,2],[4,1],[4,3],[4,4],[4,3],[4,3],[4,4]]},{"id":"H02","t":"衣食住と宗教","q":[[4,2],[4,3],[4,4],[4,4],[4,4],[6,5]]},{"id":"H03","t":"民族問題・難民・国家","q":[[4,3],[4,4],[4,4],[6,5],[4,3],[6,5],[4,4],[4,4],[4,4],[4,4]]},{"id":"H04","t":"宗教・言語の分布と生活","q":[[4,4],[4,4],[4,2],[4,4],[4,4]]}]},{"p":"第9部","n":"地誌","th":[{"id":"I01","t":"東アジア（中国）","q":[[4,3],[6,3],[4,3],[4,2],[4,4],[4,4],[4,4]]},{"id":"I02","t":"南アジア・東南アジア","q":[[4,4],[4,4],[4,4],[4,1],[4,1],[4,4]]},{"id":"I03","t":"西アジア・アフリカ","q":[[4,3],[6,4],[6,2],[4,3],[4,4],[4,4],[4,1],[4,2]]},{"id":"I04","t":"ヨーロッパ・ロシア・北極圏","q":[[4,1],[4,4],[6,3],[4,2],[4,2],[4,1],[6,4],[4,4],[4,4],[4,4]]},{"id":"I05","t":"アングロアメリカ","q":[[6,6],[4,2],[4,4],[6,4]]},{"id":"I06","t":"ラテンアメリカ","q":[[4,4],[4,1],[6,2],[4,3]]},{"id":"I07","t":"オセアニア・南極","q":[[4,1],[4,2],[6,5],[6,5],[4,1],[4,4],[4,2]]},{"id":"I08","t":"ロシアと周辺諸国","q":[[4,4],[4,4],[4,4],[4,2],[4,4],[6,2]]},{"id":"I09","t":"地域比較と旧植民地のつながり","q":[[4,4],[4,4],[6,3],[4,1],[4,4],[4,3],[4,4]]}]},{"p":"第10部","n":"地図と地理情報","th":[{"id":"J01","t":"地球と地図（図法・時差）","q":[[4,4],[4,4],[4,2],[4,1],[4,3],[4,4]]},{"id":"J02","t":"地形図の読み取り","q":[[4,4],[4,4]]},{"id":"J03","t":"主題図・GIS・地域調査","q":[[4,1],[4,1],[4,1],[4,2],[4,4],[6,1]]},{"id":"J04","t":"地図・統計の読み取り演習","q":[[4,1],[4,3],[4,3],[4,4],[4,4]]}]}];
const MARU='①②③④⑤⑥⑦⑧⑨';
const $=s=>document.querySelector(s);
const TH={};DATA.forEach((p,pi)=>p.th.forEach(t=>TH[t.id]={...t,pi,p:p.p,pn:p.n}));
let part=0, marks={}, graded=null, attempts=[], store=null, deleting=null;
// ---------- storage ----------
const LS='marks_attempts_v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(attempts))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('marks_draft')||'null');if(d){part=d.part||0;marks=d.marks||{}}}catch(e){}
function saveDraft(){try{localStorage.setItem('marks_draft',JSON.stringify({part,marks}))}catch(e){}}
attempts=lsLoad();
$('#store').textContent='記録はこの端末のブラウザに保存されます（Claudeにサインインしていると、どの端末からでも見られるように同期します）';
(async()=>{
  try{
    const [db,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection('data/users/'+uid);
    store={col};
    let first=true;
    const timer=setTimeout(()=>{$('#store').textContent='記録の同期先にまだ接続できません。この端末には保存されています。'},10000);
    col.onSnapshot(snap=>{
      clearTimeout(timer);
      const remote=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(first){first=false;
        const ids=new Set(remote.map(a=>a.id));
        const local=attempts.filter(a=>!ids.has(a.id));
        (async()=>{for(const a of local){try{const {id,...body}=a;await col.doc(id).set(body)}catch(e){}}})();
        attempts=[...remote,...local];
      } else attempts=remote;
      attempts.sort((a,b)=>a.at<b.at?-1:1); lsSave();
      $('#store').textContent='記録はあなたのアカウントに保存され、どの端末からでも見られます（本人だけが見られます）';
      renderStat();renderHist();
    },e=>{clearTimeout(timer);$('#store').textContent='同期できなかったため、この端末のブラウザに保存しています。'});
  }catch(e){}
})();
async function persist(a){attempts.push(a);lsSave();if(store){const {id,...body}=a;try{await store.col.doc(id).set(body)}catch(e){$('#msg').textContent='同期に失敗しました。この端末には保存されています。'}}}
async function remove(id){attempts=attempts.filter(a=>a.id!==id);lsSave();if(store){try{await store.col.doc(id).delete()}catch(e){}}renderStat();renderHist()}
// ---------- tabs ----------
['mark','stat','hist'].forEach(k=>{$('#tab-'+k).onclick=()=>{['mark','stat','hist'].forEach(j=>{$('#tab-'+j).setAttribute('aria-selected',j===k);$('#v-'+j).hidden=j!==k});$('#bar').hidden=k!=='mark';if(k==='stat')renderStat();if(k==='hist')renderHist()}});
// ---------- mark view ----------
function renderParts(){$('#parts').innerHTML=DATA.map((p,i)=>`<button class="chip" aria-pressed="${i===part}" data-i="${i}">${p.p}<small>${p.n}</small></button>`).join('');
  document.querySelectorAll('#parts .chip').forEach(b=>b.onclick=()=>{part=+b.dataset.i;graded=null;saveDraft();renderMark()})}
function renderMark(){
  renderParts();const P=DATA[part];
  $('#ptitle').textContent=P.p+'　'+P.n;
  const nq=P.th.reduce((s,t)=>s+t.q.length,0);$('#pinfo').textContent=`${P.th.length}テーマ・${nq}問`;
  $('#sheet').innerHTML=P.th.map(t=>{
    const g=graded&&graded.themes[t.id];
    return `<div class="theme"><div class="thead"><span class="tid">${t.id}</span><span class="ttl">${t.t}</span><span class="tscore">${g?g.c+' / '+g.n:''}</span></div>`+
    t.q.map(([n,a],i)=>{const k=t.id+'-'+(i+1),m=marks[k];let cls='',mk='';
      if(g){const ok=m===a;cls=ok?'ok':'ng';mk=ok?'○':'×'}
      return `<div class="row ${cls}"><span class="qn">${k}</span><div class="bub" role="group" aria-label="${k}の解答">`+
      Array.from({length:n},(_,j)=>`<button class="b${g&&j+1===a?' ans':''}" aria-pressed="${m===j+1}" aria-label="${k} ${MARU[j]}" data-k="${k}" data-v="${j+1}">${j+1}</button>`).join('')+`</div><span class="mk">${mk}</span></div>`}).join('')+'</div>'}).join('');
  document.querySelectorAll('#sheet .b').forEach(b=>b.onclick=()=>{if(graded)return;const k=b.dataset.k,v=+b.dataset.v;marks[k]=marks[k]===v?undefined:v;if(marks[k]===undefined)delete marks[k];saveDraft();
    b.parentNode.querySelectorAll('.b').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===marks[k]));updCount()});
  updCount();renderResult();
  $('#grade').textContent=graded?'次の解答をはじめる':'採点して記録';
}
function updCount(){const P=DATA[part];const keys=P.th.flatMap(t=>t.q.map((_,i)=>t.id+'-'+(i+1)));const n=keys.filter(k=>marks[k]).length;$('#cnt').textContent=`${n} / ${keys.length}`;$('#grade').disabled=!graded&&n===0}
function level(r){return r==null?'none':r<0.6?'weak':r<0.8?'mid':'good'}
const LV={weak:'苦手',mid:'要復習',good:'得意',none:'未挑戦'};
function renderResult(){
  if(!graded){$('#result').innerHTML='';return}
  const ts=Object.entries(graded.themes);const c=ts.reduce((s,[,v])=>s+v.c,0),n=ts.reduce((s,[,v])=>s+v.n,0);
  $('#result').innerHTML=`<div class="result"><h3>採点結果　${c} / ${n}（${Math.round(c/n*100)}%）</h3><div class="rgrid">`+
  ts.map(([id,v])=>{const r=v.c/v.n,l=level(r);return `<div class="rcard"><div class="top"><span class="tid">${id}</span><b class="tscore">${v.c} / ${v.n}</b><span class="pill ${l}">${LV[l]}</span></div><div>${TH[id].t}</div>${v.w.length?`<div class="wrong">間違えた問題：${v.w.join('、')}</div>`:'<div class="wrong">全問正解</div>'}</div>`}).join('')+
  `</div><p class="msg">緑の二重丸が正解です。間違えた問題は別冊の解答解説で確認しましょう。記録は「テーマ別成績」に反映されました。</p></div>`;
}
$('#grade').onclick=async()=>{
  if(graded){for(const t of DATA[part].th)t.q.forEach((_,i)=>delete marks[t.id+'-'+(i+1)]);graded=null;saveDraft();renderMark();window.scrollTo({top:0});return}
  const P=DATA[part],themes={};
  for(const t of P.th){const ks=t.q.map((_,i)=>t.id+'-'+(i+1));if(!ks.some(k=>marks[k]))continue;
    let c=0,w=[];t.q.forEach(([n,a],i)=>{const k=ks[i];if(marks[k]===a)c++;else w.push(k)});themes[t.id]={c,n:t.q.length,w}}
  graded={themes};
  const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),part:P.p,themes};
  renderMark();$('#result').scrollIntoView({behavior:'smooth',block:'start'});
  await persist(a);
};
$('#clear').onclick=()=>{if(graded)return;for(const t of DATA[part].th)t.q.forEach((_,i)=>delete marks[t.id+'-'+(i+1)]);saveDraft();renderMark()};
// ---------- stats ----------
function themeStats(){
  const S={};for(const id in TH)S[id]={hist:[]};
  for(const a of attempts)for(const [id,v] of Object.entries(a.themes||{}))if(S[id])S[id].hist.push({at:a.at,r:v.c/v.n,c:v.c,n:v.n});
  for(const id in S){const h=S[id].hist;S[id].last=h.length?h[h.length-1].r:null;S[id].best=h.length?Math.max(...h.map(x=>x.r)):null;S[id].lastc=h.length?h[h.length-1]:null}
  return S;
}
function spark(h){if(h.length<2)return '';const w=80,hh=22,xs=h.slice(-8);const pts=xs.map((x,i)=>`${(i/(xs.length-1)*(w-6)+3).toFixed(1)},${(hh-3-x.r*(hh-6)).toFixed(1)}`);const last=pts[pts.length-1].split(',');
  return `<svg class="sp" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true"><line x1="3" x2="${w-3}" y1="${(hh-3-0.6*(hh-6)).toFixed(1)}" y2="${(hh-3-0.6*(hh-6)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 2"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--teal)"/></svg>`}
function pct(r){return r==null?'—':Math.round(r*100)+'%'}
$('#fpart').innerHTML='<option value="-1">すべての部</option>'+DATA.map((p,i)=>`<option value="${i}">${p.p} ${p.n}</option>`).join('');
$('#fpart').onchange=renderStat;$('#fsort').onchange=renderStat;
function renderStat(){
  const S=themeStats();const tried=Object.keys(S).filter(id=>S[id].last!=null);
  const tc=attempts.reduce((s,a)=>s+Object.values(a.themes||{}).reduce((x,v)=>x+v.c,0),0),tn=attempts.reduce((s,a)=>s+Object.values(a.themes||{}).reduce((x,v)=>x+v.n,0),0);
  const weak=tried.filter(id=>S[id].last<0.6);
  $('#sum').innerHTML=`<div class="stat"><b>${tn?Math.round(tc/tn*100)+'%':'—'}</b><span>通算の正答率（${tc} / ${tn}問）</span></div><div class="stat"><b>${tried.length}<small style="font-size:14px"> / ${Object.keys(TH).length}</small></b><span>挑戦したテーマ</span></div><div class="stat"><b style="color:var(--bad)">${weak.length}</b><span>苦手テーマ（最新60%未満）</span></div><div class="stat"><b>${attempts.length}</b><span>採点した回数</span></div>`;
  const ranked=tried.slice().sort((a,b)=>S[a].last-S[b].last||S[a].best-S[b].best).slice(0,5).filter(id=>S[id].last<0.8);
  $('#weak').innerHTML=tried.length?(ranked.length?`<div class="weaklist"><h3>優先して復習するテーマ</h3><ol>${ranked.map(id=>`<li><span class="tid">${id}</span> ${TH[id].t}（${TH[id].p}）… 最新 ${S[id].lastc.c}/${S[id].lastc.n}</li>`).join('')}</ol></div>`:`<div class="weaklist" style="border-color:var(--good)"><h3 style="color:var(--good)">挑戦したテーマはすべて80%以上です</h3>まだ挑戦していない部に進みましょう。</div>`)
    :`<div class="empty">まだ記録がありません。<br>「マーク」タブで部を選び、問題を解いたあと解答をマークして「採点して記録」を押すと、ここにテーマごとの正答率と苦手テーマが表示されます。</div>`;
  const fp=+$('#fpart').value;let ids=Object.keys(TH).filter(id=>fp<0||TH[id].pi===fp);
  if($('#fsort').value==='rate')ids.sort((a,b)=>(S[a].last??2)-(S[b].last??2)||TH[a].pi-TH[b].pi);
  $('#stbody').innerHTML=ids.map(id=>{const s=S[id],l=level(s.last);return `<tr><td class="t"><span class="tid">${id}</span> ${TH[id].t}<br><small style="color:var(--sub)">${TH[id].p} ${TH[id].pn}・${TH[id].q.length}問</small></td><td><span class="pill ${l}">${LV[l]}</span></td><td>${s.lastc?`${s.lastc.c}/${s.lastc.n}<br><span class="meter"><i style="width:${Math.round(s.last*100)}%"></i></span>`:'—'}</td><td>${pct(s.best)}</td><td>${s.hist.length}</td><td>${spark(s.hist)}</td></tr>`}).join('');
}
// ---------- history ----------
function renderHist(){
  if(!attempts.length){$('#hist').innerHTML='<div class="empty">採点した記録がここに並びます。</div>';return}
  $('#hist').innerHTML=attempts.slice().reverse().map(a=>{const v=Object.entries(a.themes||{});const c=v.reduce((s,[,x])=>s+x.c,0),n=v.reduce((s,[,x])=>s+x.n,0);const d=new Date(a.at);
    return `<div class="hcard"><span class="d">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span><b>${a.part}</b><span class="s">${c} / ${n}（${Math.round(c/n*100)}%）</span><button class="del${deleting===a.id?' confirm':''}" data-id="${a.id}">${deleting===a.id?'もう一度押すと削除':'削除'}</button><div class="th">${v.map(([id,x])=>`${id} ${x.c}/${x.n}`).join('　')}</div></div>`}).join('');
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(deleting===id){deleting=null;remove(id)}else{deleting=id;renderHist()}});
}
renderMark();
</script>

</body></html>
