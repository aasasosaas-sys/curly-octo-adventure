<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テーマ別問題集 マークシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --paper:#F4F7F6;--sheet:#FFFFFF;--ink:#18302E;--sub:#5B6F6C;--line:#D5DFDC;--drop:#E0664F;--dropsoft:#FBE3DD;--teal:#0F4C5C;--tealsoft:#DCEBEE;
 --good:#2E7D4F;--goodsoft:#DDF1E4;--warn:#B7791F;--warnsoft:#FBF0D9;--bad:#C2412D;--badsoft:#FADFD9;
 --f-disp:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;--f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;--f-num:"Roboto Mono",ui-monospace,monospace}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1716;--sheet:#16211F;--ink:#E3ECEA;--sub:#93A8A4;--line:#2A3A37;--drop:#F08A74;--dropsoft:#3A2420;--teal:#6CB8C9;--tealsoft:#173238;--good:#6CCB92;--goodsoft:#173225;--warn:#E6B45C;--warnsoft:#33291A;--bad:#F08A74;--badsoft:#3A2420;color-scheme:dark}}
/* 教材ごとのアクセント色（地理＝青緑／生物基礎 知識編＝緑青／生物基礎 思考編＝赤） */
.c-chiri{--teal:#0F4C5C;--tealsoft:#DCEBEE}.c-sk{--teal:#1A6A4A;--tealsoft:#DDF1E4}.c-ss{--teal:#B5382A;--tealsoft:#FBE3DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-chiri{--teal:#6CB8C9;--tealsoft:#173238}:root:not([data-theme="light"]) .c-sk{--teal:#6CCB92;--tealsoft:#173225}:root:not([data-theme="light"]) .c-ss{--teal:#F08A74;--tealsoft:#3A2420}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto}
header{padding-block:18px 8px}
h1{font-family:var(--f-disp);font-weight:900;font-size:clamp(21px,4.5vw,28px);margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.12em}
.store{font-size:12px;color:var(--sub);margin-top:4px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
nav.tabs{display:flex;gap:4px;padding-block:6px 0;border-bottom:2px solid var(--ink)}
nav.tabs button{font:700 15px var(--f-body);background:none;border:0;padding:8px 12px;border-radius:8px 8px 0 0;color:var(--sub);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.books{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.books::-webkit-scrollbar{display:none}
.bk{flex:none;font:700 13px var(--f-body);border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.bk i{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block}
.bk[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:var(--sheet)}
.bk[aria-selected="true"] i{background:var(--sheet)}
.swipehint{font-size:11.5px;color:var(--sub);padding-bottom:4px}
.parts{display:flex;flex-wrap:wrap;gap:6px;padding-block:12px 6px}
.chip{font:700 13px var(--f-body);border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:var(--sheet)}
.chip small{font-weight:400;opacity:.8;margin-left:4px}
.parthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-block:6px}
.parthead h2{font-family:var(--f-disp);font-size:20px;margin:0}.parthead span{color:var(--sub);font-size:13px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.theme{border-top:1px solid var(--line)}.theme:first-child{border-top:0}
.thead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--tealsoft)}
.tid{font:700 13px var(--f-num);background:var(--teal);color:var(--sheet);border-radius:4px;padding:1px 7px}
.ttl{font-weight:700;flex:1;min-width:0}.tscore{font:700 14px var(--f-num);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:5px 14px;border-top:1px dashed var(--line)}
.qn{font:500 13px var(--f-num);color:var(--sub);width:62px;flex:none}
.bub{display:flex;flex-wrap:wrap;gap:6px}
.b{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--drop);background:transparent;color:var(--drop);font:700 14px var(--f-num);cursor:pointer;display:grid;place-items:center;padding:0;touch-action:manipulation}
.b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.row.ok .b[aria-pressed="true"]{background:var(--good);border-color:var(--good)}.row.ng .b[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.row .b.ans{box-shadow:0 0 0 3px var(--goodsoft),0 0 0 5px var(--good)}
.mk{margin-left:auto;font:700 13px var(--f-num);min-width:2.5em;text-align:right}.row.ok .mk{color:var(--good)}.row.ng .mk{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:2px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.cnt{font:700 15px var(--f-num)}.btn{font:700 15px var(--f-body);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.pri{background:var(--drop);color:#fff}.btn.sec{background:var(--tealsoft);color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13px;color:var(--sub);flex:1;min-width:160px}
.result{margin-block:14px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;padding:14px}.result h3{margin:0 0 6px;font-family:var(--f-disp)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}.rcard .top{display:flex;align-items:center;gap:8px}
.pill{font:700 12px var(--f-body);border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.weak{background:var(--badsoft);color:var(--bad)}.pill.mid{background:var(--warnsoft);color:var(--warn)}.pill.good{background:var(--goodsoft);color:var(--good)}.pill.none{background:var(--line);color:var(--sub)}
.wrong{font:500 12px var(--f-num);color:var(--sub);margin-top:3px;word-break:break-all}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.stat b{display:block;font:700 26px var(--f-num)}.stat span{font-size:12px;color:var(--sub)}
.weaklist{background:var(--sheet);border:2px solid var(--bad);border-radius:10px;padding:12px 14px;margin-block:10px}.weaklist h3{margin:0 0 6px;font-family:var(--f-disp);color:var(--bad);font-size:17px}.weaklist ol{margin:0;padding-left:1.4em}
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--sub);font-weight:700;background:var(--tealsoft);position:sticky;top:0}td.t{white-space:normal;min-width:11em}
.meter{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}.meter i{display:block;height:100%;background:var(--teal)}
svg.sp{vertical-align:middle}
.hist{display:grid;gap:8px}.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.hcard .d{font:500 13px var(--f-num);color:var(--sub)}.hcard .s{font:700 16px var(--f-num)}.hcard .th{flex-basis:100%;font-size:13px;color:var(--sub)}
.del{margin-left:auto;font:700 12px var(--f-body);background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:4px 10px;cursor:pointer}.del.confirm{border-color:var(--bad);color:var(--bad)}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--sub);text-align:center}
.legend{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 12px;margin-block:6px}
select{font:700 14px var(--f-body);padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
/* 復習ヒント（思考編→知識編） */
.hint{margin-top:12px;border:2px solid var(--teal);border-radius:10px;padding:10px 14px;background:var(--sheet)}
.hint h4{margin:0 0 4px;font-family:var(--f-disp);font-size:16px;color:var(--teal)}
.hint .sub{font-size:12px;color:var(--sub);margin:0 0 6px}
.hitem{padding:7px 0;border-top:1px dashed var(--line)}.hitem:first-of-type{border-top:0}
.hitem b.q{font:700 13px var(--f-num)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:13.5px}
.rec .st{font:700 11.5px var(--f-body);border-radius:999px;padding:0 8px}
.st.ng{background:var(--badsoft);color:var(--bad)}.st.un{background:var(--warnsoft);color:var(--warn)}.st.ok{background:var(--goodsoft);color:var(--good)}
.go{font:700 12px var(--f-body);background:var(--tealsoft);color:var(--ink);border:0;border-radius:6px;padding:3px 10px;cursor:pointer}
/* 設定 */
.setcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;margin-block:12px}
.setcard h3{margin:0 0 8px;font-family:var(--f-disp);font-size:17px}
.subj{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}.subj:first-of-type{border-top:0}
.subj label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.subj input[type=checkbox]{width:24px;height:24px;accent-color:var(--teal);flex:none}
.subj b{font-size:16px}.subj small{display:block;color:var(--sub);font-size:12.5px}
.tag{font:700 11.5px var(--f-body);border-radius:999px;padding:1px 9px;background:var(--line);color:var(--sub);white-space:nowrap}
.sw{display:flex;align-items:center;gap:12px;padding-block:6px}.sw input{width:24px;height:24px;accent-color:var(--teal)}
@keyframes inL{from{opacity:.2;transform:translateX(34px)}to{opacity:1;transform:none}}@keyframes inR{from{opacity:.2;transform:translateX(-34px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.slideL{animation:inL .22s ease-out}.slideR{animation:inR .22s ease-out}.b{transition:background .12s,transform .08s}.b:active{transform:scale(.92)}}
@media (max-width:480px){.b{width:30px;height:30px;font-size:13px}.qn{width:52px}.row{gap:6px;padding:5px 10px}}
</style></head>
<body>
<div class="wrap" id="app">
<header><h1><small id="hsmall">テーマ別問題集</small><span id="htitle">マークシート</span></h1><div class="store" id="store">記録の保存先を確認中…</div></header>
<div class="sticky">
<nav class="tabs" role="tablist"><button role="tab" id="tab-mark" aria-selected="true">マーク</button><button role="tab" id="tab-stat" aria-selected="false">テーマ別成績</button><button role="tab" id="tab-hist" aria-selected="false">履歴</button><button role="tab" id="tab-set" aria-selected="false">設定</button></nav>
<div class="books" id="books" role="tablist" aria-label="教材"></div>
<div class="swipehint" id="swipehint">← 左右にスワイプすると、ほかの教材のマークシートに切り替わります →</div>
</div>
<div id="pager">
<section id="v-mark"><div class="parts" id="parts"></div><div class="parthead"><h2 id="ptitle"></h2><span id="pinfo"></span></div><div id="result"></div><div class="sheet" id="sheet"></div></section>
<section id="v-stat" hidden><div class="sum" id="sum"></div><div id="weak"></div><div id="hintStat"></div>
<div class="filters"><label for="fpart">表示する部</label><select id="fpart"></select><label for="fsort">並べ方</label><select id="fsort"><option value="rate">苦手順（正答率が低い順）</option><option value="id">テーマ番号順</option></select></div>
<div class="legend"><span class="pill weak">苦手</span>最新の正答率60%未満 <span class="pill mid">要復習</span>60〜79% <span class="pill good">得意</span>80%以上 <span class="pill none">未挑戦</span></div>
<div class="tbl"><table><thead><tr><th>テーマ</th><th>判定</th><th>最新</th><th>最高</th><th>回数</th><th>推移</th></tr></thead><tbody id="stbody"></tbody></table></div></section>
<section id="v-hist" hidden><div class="hist" id="hist"></div></section>
<section id="v-set" hidden></section>
</div></div>
<div class="bar" id="bar"><div class="in"><span class="cnt" id="cnt">0 / 0</span><span class="msg" id="msg">マークしたテーマだけ採点します。テーマ内の未マークは不正解として数えます。</span><button class="btn sec" id="clear">消去</button><button class="btn pri" id="grade">採点して記録</button></div></div>

 if(B.id==='seibutsu-s'&&settings.hint){const items=[];ts.forEach(([id,v])=>{const t=B.TH[id];const seen={};(v.w||[]).forEach(k=>{const i=+k.split('-').pop()-1;const g=t.q[i]&&t.q[i][3];if(g!=null&&!seen[g]){seen[g]=1;items.push({g,th:id,t:(t.pt||{})[g]||''})}})});
  if(items.length)html+=hintHTML(B,items,'この間違いは，知識編のこの問題で復習しよう')}
 $('#result').innerHTML=html+'</div>';bindGo($('#result'))}
$('#grade').onclick=async()=>{const B=cur();const graded=gradedAll[B.id];const P=B.data[getPart()];
 if(graded){const m=marks();for(const t of P.th)t.q.forEach((_,i)=>delete m[keyOf(t,i)]);gradedAll[B.id]=null;saveDraft();renderMark();window.scrollTo({top:0});return}
 const themes={},m=marks();
 for(const t of P.th){const ks=t.q.map((_,i)=>keyOf(t,i));if(!ks.some(k=>m[k]))continue;const ev=evalTheme(t);let c=0,w=[];ev.forEach((ok,i)=>{if(ok)c++;else w.push(ks[i])});themes[t.id]={c,n:t.q.length,w}}
 gradedAll[B.id]={themes};const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),book:B.id,part:P.p,themes};
 renderMark();$('#result').scrollIntoView({behavior:'smooth',block:'start'});await persist(a)};
$('#clear').onclick=()=>{const B=cur();if(gradedAll[B.id])return;const m=marks();for(const t of B.data[getPart()].th)t.q.forEach((_,i)=>delete m[keyOf(t,i)]);saveDraft();renderMark()};
// ---------- 成績 ----------
function themeStats(B){const S={};for(const id in B.TH)S[id]={hist:[]};
 for(const a of attempts.filter(a=>a.book===B.id))for(const [id,v] of Object.entries(a.themes||{}))if(S[id])S[id].hist.push({at:a.at,r:v.c/v.n,c:v.c,n:v.n});
 for(const id in S){const h=S[id].hist;S[id].last=h.length?h[h.length-1].r:null;S[id].best=h.length?Math.max(...h.map(x=>x.r)):null;S[id].lastc=h.length?h[h.length-1]:null}return S}
function spark(h){if(h.length<2)return'';const w=80,hh=22,xs=h.slice(-8);const pts=xs.map((x,i)=>`${(i/(xs.length-1)*(w-6)+3).toFixed(1)},${(hh-3-x.r*(hh-6)).toFixed(1)}`);const last=pts[pts.length-1].split(',');
 return `<svg class="sp" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true"><line x1="3" x2="${w-3}" y1="${(hh-3-0.6*(hh-6)).toFixed(1)}" y2="${(hh-3-0.6*(hh-6)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 2"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--teal)"/></svg>`}
const pct=r=>r==null?'—':Math.round(r*100)+'%';
function renderStat(){const B=cur();if(!B)return;const S=themeStats(B);const tried=Object.keys(S).filter(id=>S[id].last!=null);const at=attempts.filter(a=>a.book===B.id);
 const tc=at.reduce((s,a)=>s+Object.values(a.themes||{}).reduce((x,v)=>x+v.c,0),0),tn=at.reduce((s,a)=>s+Object.values(a.themes||{}).reduce((x,v)=>x+v.n,0),0);const weak=tried.filter(id=>S[id].last<0.6);
 $('#sum').innerHTML=`<div class="stat"><b>${tn?Math.round(tc/tn*100)+'%':'—'}</b><span>通算の正答率（${tc} / ${tn}問）</span></div><div class="stat"><b>${tried.length}<small style="font-size:14px"> / ${Object.keys(B.TH).length}</small></b><span>挑戦したテーマ</span></div><div class="stat"><b style="color:var(--bad)">${weak.length}</b><span>苦手テーマ（最新60%未満）</span></div><div class="stat"><b>${at.length}</b><span>採点した回数</span></div>`;
 const ranked=tried.slice().sort((a,b)=>S[a].last-S[b].last||S[a].best-S[b].best).slice(0,5).filter(id=>S[id].last<0.8);
 $('#weak').innerHTML=tried.length?(ranked.length?`<div class="weaklist"><h3>優先して復習するテーマ</h3><ol>${ranked.map(id=>`<li><span class="tid">${id}</span> ${B.TH[id].t}（${B.TH[id].p}）… 最新 ${S[id].lastc.c}/${S[id].lastc.n}</li>`).join('')}</ol></div>`:`<div class="weaklist" style="border-color:var(--good)"><h3 style="color:var(--good)">挑戦したテーマはすべて80%以上です</h3>まだ挑戦していない部に進みましょう。</div>`)
  :`<div class="empty">${B.subject} ${B.name}の記録がまだありません。<br>「マーク」タブで部を選び、解答をマークして「採点して記録」を押すと、ここにテーマごとの正答率と苦手テーマが表示されます。</div>`;
 // 思考編 → 知識編 のおすすめ
 const hs=$('#hintStat');hs.innerHTML='';
 if(B.id==='seibutsu-s'&&settings.hint){const wp=wrongProblems(B);if(wp.length){const KB=BY('seibutsu-k'),pst=problemStatus(KB),cnt={};
   wp.forEach(w=>(REL[w.g]||[]).forEach(k=>{cnt[k]=cnt[k]||{n:0,from:[]};cnt[k].n++;cnt[k].from.push(w.g)}));
  const rank=Object.keys(cnt).map(k=>({g:k,...KP[k],n:cnt[k].n,from:cnt[k].from,st:pst[k]||'un'})).sort((a,b)=>({ng:0,un:1,ok:2}[a.st]-{ng:0,un:1,ok:2}[b.st])||b.n-a.n).slice(0,8);
  hs.innerHTML=`<div class="hint"><h4>知識編で復習したい問題（思考編の最新の間違いから）</h4><p class="sub">思考編で最後に間違えた${wp.length}問に関係する知識編の問題です。「前回×」「未挑戦」を優先して並べています。</p>`+rank.map(r=>`<div class="rec" style="padding:4px 0"><span class="st ${r.st}">${STL[r.st]}</span><span>知識編 ${r.th}　問${r.g}「${r.t}」<small style="color:var(--sub)">（思考編 問${r.from.join('・')}に関係）</small></span><button class="go" data-kg="${r.g}" data-th="${r.th}">知識編を開く</button></div>`).join('')+'</div>';bindGo(hs)}}
 const sel=$('#fpart');const cp=sel.value;sel.innerHTML='<option value="-1">すべての部</option>'+B.data.map((p,i)=>`<option value="${i}">${p.p} ${p.n}</option>`).join('');sel.value=cp&&+cp<B.data.length?cp:'-1';
 sel.onchange=renderStat;$('#fsort').onchange=renderStat;
 const fp=+sel.value;let ids=Object.keys(B.TH).filter(id=>fp<0||B.TH[id].pi===fp);if($('#fsort').value==='rate')ids.sort((a,b)=>(S[a].last??2)-(S[b].last??2)||B.TH[a].pi-B.TH[b].pi);
 $('#stbody').innerHTML=ids.map(id=>{const s=S[id],l=level(s.last);return `<tr><td class="t"><span class="tid">${id}</span> ${B.TH[id].t}<br><small style="color:var(--sub)">${B.TH[id].p} ${B.TH[id].pn}・${B.TH[id].q.length}問</small></td><td><span class="pill ${l}">${LV[l]}</span></td><td>${s.lastc?`${s.lastc.c}/${s.lastc.n}<br><span class="meter"><i style="width:${Math.round(s.last*100)}%"></i></span>`:'—'}</td><td>${pct(s.best)}</td><td>${s.hist.length}</td><td>${spark(s.hist)}</td></tr>`}).join('')}
// ---------- 履歴 ----------
function renderHist(){const B=cur();if(!B)return;const list=attempts.filter(a=>a.book===B.id);if(!list.length){$('#hist').innerHTML=`<div class="empty">${B.subject} ${B.name}の採点記録がここに並びます。</div>`;return}
 $('#hist').innerHTML=list.slice().reverse().map(a=>{const v=Object.entries(a.themes||{});const c=v.reduce((s,[,x])=>s+x.c,0),n=v.reduce((s,[,x])=>s+x.n,0);const d=new Date(a.at);
  return `<div class="hcard"><span class="d">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span><b>${a.part}</b><span class="s">${c} / ${n}（${Math.round(c/n*100)}%）</span><button class="del${deleting===a.id?' confirm':''}" data-id="${a.id}">${deleting===a.id?'もう一度押すと削除':'削除'}</button><div class="th">${v.map(([id,x])=>`${id} ${x.c}/${x.n}`).join('　')}</div></div>`}).join('');
 document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(deleting===id){deleting=null;remove(id)}else{deleting=id;renderHist()}})}

function renderSet(){const nb={};BOOKS.forEach(b=>(nb[b.subject]=nb[b.subject]||[]).push(b.name));
 $('#v-set').innerHTML=`<div class="setcard"><h3>選択科目</h3><p style="margin:0 0 6px;font-size:13px;color:var(--sub)">受験で使う科目を選ぶと，その科目の教材だけがマークシートのタブに並びます（スワイプで切り替え）。</p>`+

 `<div class="setcard"><h3>表示</h3><label class="sw"><input type="checkbox" id="optHint" ${settings.hint?'checked':''}><span>生物基礎：思考編で間違えた問題に，復習すると良い知識編の問題を表示する<small style="display:block;color:var(--sub);font-size:12.5px">知識編から思考編への案内は表示しません。</small></span></label></div>`+
 `<div class="setcard"><h3>この端末の記録</h3><p style="margin:0;font-size:13px;color:var(--sub)">採点した記録は，Claudeにサインインしていれば自動で同期されます。選択科目などの設定は，この端末のブラウザに保存されます。</p></div>`;
